<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>
  <g transform="translate(14, 14)" stroke="#00d4ff" stroke-width="2.5" fill="none">
    <!-- Drawing frame -->
    <rect x="0" y="0" width="100" height="100" rx="4" stroke="#3a3a5c" stroke-width="1.5"/>
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="100" y2="50" stroke="#2a2a4c" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#2a2a4c" stroke-width="0.5"/>
    <!-- Floor plan walls -->
    <rect x="15" y="15" width="70" height="55" stroke-width="3" stroke="#00d4ff"/>
    <line x1="50" y1="15" x2="50" y2="70" stroke-width="2"/>
    <line x1="15" y1="45" x2="50" y2="45" stroke-width="2"/>
    <!-- Door arc -->
    <path d="M 50 55 A 12 12 0 0 1 62 67" stroke="#4ade80" stroke-width="2"/>
    <line x1="50" y1="55" x2="50" y2="67" stroke="#4ade80" stroke-width="1.5"/>
    <!-- Window -->
    <line x1="25" y1="15" x2="42" y2="15" stroke="#60a5fa" stroke-width="3"/>
    <!-- Dimension -->
    <line x1="15" y1="80" x2="85" y2="80" stroke="#f472b6" stroke-width="1"/>
    <line x1="15" y1="77" x2="15" y2="83" stroke="#f472b6" stroke-width="1"/>
    <line x1="85" y1="77" x2="85" y2="83" stroke="#f472b6" stroke-width="1"/>
    <text x="50" y="78" text-anchor="middle" fill="#f472b6" font-size="8" font-family="monospace" stroke="none">70</text>
    <!-- CAD label -->
    <text x="50" y="97" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold" font-family="monospace" stroke="none">DXF</text>
  </g>
</svg>
